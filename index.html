<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width,initial-scale=1,viewport-fit=cover"
    />
    <meta name="theme-color" content="#121110" />
    <meta
      name="description"
      content="An endless tower. A lasting legacy. A mobile incremental dungeon RPG."
    />
    <link rel="icon" href="./favicon.ico" sizes="48x48" />
    <link rel="icon" type="image/png" sizes="32x32" href="./icons/icon-32.png" />
    <link rel="icon" type="image/png" sizes="512x512" href="./icons/icon-512.png" />
    <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <title>Tower Delve</title>
    <script>try { document.documentElement.classList.add("experimental-atlas"); if (JSON.parse(localStorage.getItem("towerdelve.v1") || "null")?.settings?.experimentalAtlas === false) document.documentElement.classList.remove("experimental-atlas"); } catch {}</script>
    <link rel="preload" href="./assets/fonts/TowerPixel/TowerPixel-Regular.woff2" as="font" type="font/woff2" crossorigin />
    <style>
      /* Before the stylesheets load: the loading screen's dark stone. */
      body { margin: 0; background: #121110; }
      #app[hidden], #boot-loading [hidden] { display: none !important; }
      #boot-loading { position: fixed; inset: 0; z-index: 10000; background: #121110; }
      /* The text waits for Tower Pixel (bootstrap.ts adds .font-ready). */
      #boot-loading:not(.font-ready) :is(.loading-label, .loading-retry) { visibility: hidden; }
    </style>
  </head>
  <body>
    <section id="boot-loading" role="status" aria-live="polite" aria-label="Loading Tower Delve">
      <canvas class="loading-stones" aria-hidden="true"></canvas>
      <canvas class="loading-torch" aria-hidden="true"></canvas>
      <div class="loading-foot">
        <span class="loading-label" id="boot-message">loading<span class="loading-dots" aria-hidden="true"><span>.</span><span>.</span><span>.</span></span></span>
        <canvas class="loading-room" aria-hidden="true"></canvas>
        <button type="button" id="boot-retry" class="loading-retry" hidden>Retry</button>
        <button type="button" id="boot-disable-atlas" class="loading-retry" hidden>Turn off experimental Atlas</button>
      </div>
    </section>
    <div id="app" hidden aria-busy="true"></div>
    <script type="module" src="/src/bootstrap.ts"></script>
  </body>
</html>
